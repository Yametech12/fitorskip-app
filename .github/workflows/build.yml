name: Build Android and iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK (release, signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # CI-safe tests only. test/screenshots_test.dart is excluded on
      # purpose: golden bytes are environment-specific.
      - run: flutter test test/verdict_engine_test.dart test/widget_test.dart test/demo_provider_test.dart test/color_sampling_test.dart
      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FIT_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/fitorskip-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=fitorskip
          storeFile=fitorskip-release.jks
          EOF
      # Split per ABI (GT-176 item 9): each phone downloads only its
      # own architecture slice instead of the universal debug bundle.
      - run: flutter build apk --release --split-per-abi
      - name: Verify APK signatures and record sizes
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            stat -c '%s bytes' "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fitorskip-android-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

  ios:
    name: iOS build (no codesign proof)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fitorskip-ios-unsigned
          path: build/ios/iphoneos/Runner.app
