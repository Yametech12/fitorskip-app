name: Build Android and iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK (debug proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # CI-safe tests only. test/screenshots_test.dart is excluded on
      # purpose: golden bytes are environment-specific.
      - run: flutter test test/verdict_engine_test.dart test/widget_test.dart test/demo_provider_test.dart
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fitorskip-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS build (no codesign proof)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fitorskip-ios-unsigned
          path: build/ios/iphoneos/Runner.app
